apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: latex-ingress
  namespace: latex-app
  annotations:
    # Настройки для NGINX Ingress Controller
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "latex-api-service"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: latex-api-service
            port:
              number: 80