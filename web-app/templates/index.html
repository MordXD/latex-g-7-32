<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaTeX Editor - GOST 7.32</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Заголовок -->
        <header class="header">
            <div class="header-left">
                <h1 class="app-title">LaTeX Editor</h1>
                <span class="file-name">main.tex</span>
            </div>
            <div class="header-right">
                <button id="saveBtn" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17,21 17,13 7,13 7,21"/>
                        <polyline points="7,3 7,8 15,8"/>
                    </svg>
                    Сохранить
                </button>
                <button id="compileBtn" class="btn btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5,3 19,12 5,21"/>
                    </svg>
                    Компилировать
                </button>
                <div class="status-indicator" id="statusIndicator">
                    <div class="status-dot"></div>
                    <span class="status-text">Готов</span>
                </div>
            </div>
        </header>

        <!-- Основная область -->
        <main class="main-content">
            <!-- Панель редактора -->
            <div class="editor-panel">
                <div class="panel-header">
                    <h2>Редактор</h2>
                    <div class="editor-controls">
                        <button class="btn-icon" id="wrapToggle" title="Перенос строк">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="4,7 4,4 20,4 20,7"/>
                                <line x1="4" y1="20" x2="16" y2="20"/>
                                <polyline points="13,17 16,20 13,23"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="editor-container">
                    <textarea id="editor" placeholder="Загрузка содержимого main.tex..."></textarea>
                    <div class="editor-info">
                        <span id="cursorPosition">Строка 1, Столбец 1</span>
                        <span id="documentStats">0 символов</span>
                    </div>
                </div>
            </div>

            <!-- Разделитель -->
            <div class="resizer" id="resizer"></div>

            <!-- Панель PDF -->
            <div class="pdf-panel">
                <div class="panel-header">
                    <h2>Предварительный просмотр</h2>
                    <div class="pdf-controls">
                        <button class="btn-icon" id="refreshPdf" title="Обновить PDF">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="23,4 23,10 17,10"/>
                                <path d="M20.49,15a9,9,0,1,1-2.12-9.36L23,10"/>
                            </svg>
                        </button>
                        <button class="btn-icon" id="downloadPdf" title="Скачать PDF">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21,15v4a2,2,0,0,1-2,2H5a2,2,0,0,1-2-2V15"/>
                                <polyline points="7,10 12,15 17,10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="pdf-container">
                    <iframe id="pdfViewer" src="/api/pdf" title="PDF Preview"></iframe>
                    <div class="pdf-placeholder" id="pdfPlaceholder">
                        <div class="placeholder-content">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M14,2H6A2,2,0,0,0,4,4V20a2,2,0,0,0,2,2H18a2,2,0,0,0,2-2V8Z"/>
                                <polyline points="14,2 14,8 20,8"/>
                                <line x1="16" y1="13" x2="8" y2="13"/>
                                <line x1="16" y1="17" x2="8" y2="17"/>
                                <polyline points="10,9 9,9 8,9"/>
                            </svg>
                            <p>PDF будет отображен после компиляции</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Панель уведомлений -->
        <div class="notifications" id="notifications"></div>
    </div>

    <!-- Скрипты -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
