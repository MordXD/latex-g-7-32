version: '3.8'

services:
  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: latex-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount latex directory for templates and styles
      - ./latex:/app/latex:ro
      # Mount pdf directory for compiled documents
      - ./pdf:/app/pdf
      # Mount logs directory
      - ./logs:/app/logs
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
      - LATEX_TIMEOUT=60
      - LATEX_OUTPUT_DIR=pdf
      - LATEX_WORK_DIR=latex
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=latex-pdfs
    depends_on:
      - rabbitmq
      - redis
      - minio
    networks:
      - latex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/latex-pdfs;
      /usr/bin/mc policy set download myminio/latex-pdfs;
      exit 0;
      "

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: latex-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./pdf:/var/www/pdf:ro
    networks:
      - latex-network
    depends_on:
      - backend
      - openwebui
    restart: unless-stopped
    profiles:
      - production
volumes:
  redis_data:
  minio_data:
networks:
  latex-network:
    driver: bridge